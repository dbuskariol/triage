name: Triage

options:
  bundleIdPrefix: com.triage
  createIntermediateGroups: true
  defaultConfig: Release
  deploymentTarget:
    macOS: "26.0"
  transitivelyLinkDependencies: true

configs:
  Debug: debug
  Release: release

packages:
  GRDB:
    path: Vendor/GRDB.swift
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift.git
    exactVersion: 4.18.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

settings:
  base:
    APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      COPY_PHASE_STRIP: NO
      DEAD_CODE_STRIPPING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      STRIP_INSTALLED_PRODUCT: YES
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Triage:
    type: application
    platform: macOS
    sources:
      - Triage
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
      - target: TriageCopilotXPC
        embed: true
        codeSign: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Triage/Triage.entitlements
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/Triage-Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        MARKETING_VERSION: 0.1.2
        PRODUCT_BUNDLE_IDENTIFIER: com.triage.mac
        PRODUCT_NAME: Triage
        SKIP_INSTALL: NO
        TRIAGE_AUTH_BROKER_URL: ""
        TRIAGE_DEVELOPMENT_TEAM: ""
        TRIAGE_GITHUB_OAUTH_CLIENT_ID: ""
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Triage/TriageDebug.entitlements

  TriageCopilotXPC:
    type: xpc-service
    platform: macOS
    sources:
      - TriageCopilotXPC
      - Triage/CopilotXPC/CopilotXPCInterface.swift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TriageCopilotXPC/TriageCopilotXPC.entitlements
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/TriageCopilotXPC-Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../Frameworks"
        MARKETING_VERSION: 0.1.2
        PRODUCT_BUNDLE_IDENTIFIER: com.triage.mac.TriageCopilotXPC
        PRODUCT_NAME: TriageCopilotXPC
        SKIP_INSTALL: YES
        TRIAGE_DEVELOPMENT_TEAM: ""
    postCompileScripts:
      - path: scripts/build-copilot-helper.sh
        name: Build Triage Copilot Helper
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/scripts/build-copilot-helper.sh
          - $(SRCROOT)/TriageCopilotHelper/Cargo.toml
          - $(SRCROOT)/TriageCopilotHelper/Cargo.lock
          - $(SRCROOT)/TriageCopilotHelper/.cargo/config.toml
          - $(SRCROOT)/TriageCopilotHelper/src
          - $(SRCROOT)/TriageCopilotHelper/src/cache.rs
          - $(SRCROOT)/TriageCopilotHelper/src/engine.rs
          - $(SRCROOT)/TriageCopilotHelper/src/environment.rs
          - $(SRCROOT)/TriageCopilotHelper/src/lib.rs
          - $(SRCROOT)/TriageCopilotHelper/src/main.rs
          - $(SRCROOT)/TriageCopilotHelper/src/protocol.rs
          - $(SRCROOT)/TriageCopilotHelper/src/schema.rs
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TriageCopilotHelper

  TriageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TriageTests
    dependencies:
      - target: Triage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.triage.mac.tests

  TriageUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - TriageUITests
    dependencies:
      - target: Triage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.triage.mac.uitests
      configs:
        Debug:
          # XCUITest injects into the Debug-only test bundle; this exception
          # does not apply to the app or any Release configuration.
          ENABLE_HARDENED_RUNTIME: NO

  TriageCopilotXPCTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TriageCopilotXPCTests
      - TriageCopilotXPC/CopilotHelperProcess.swift
      - TriageCopilotXPC/CopilotXPCCallerValidator.swift
      - TriageCopilotXPC/CopilotXPCFrame.swift
      - TriageCopilotXPC/TriageCopilotXPCService.swift
      - TriageCopilotXPC/TriageCopilotXPCListener.swift
      - Triage/CopilotXPC/CopilotXPCInterface.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.triage.mac.copilotxpctests

schemes:
  Triage:
    build:
      targets:
        Triage: all
        TriageTests: [test]
        TriageUITests: [test]
        TriageCopilotXPCTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TriageTests
          parallelizable: true
        - name: TriageUITests
          parallelizable: false
        - name: TriageCopilotXPCTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
