[package]
name = "triage-copilot-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Sandboxed stdin/stdout Copilot boundary for Triage"

[dependencies]
async-trait = "=0.1.92"
chrono = { version = "=0.4.44", features = ["serde"] }
github-copilot-sdk = { version = "=1.0.13-preview.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time", "process", "signal", "io-util"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
