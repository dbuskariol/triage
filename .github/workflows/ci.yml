name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Triage (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    steps:
      # The runner context isn't available in job-level env. The helper build
      # runs cargo with a cleared environment that forwards only these, and
      # rustup's proxies need them to find the pinned toolchain.
      - name: Set build environment
        run: |
          {
            echo "TRIAGE_CI_DERIVED_DATA=$RUNNER_TEMP/triage-ci-derived-data"
            echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
            echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}"
          } >> "$GITHUB_ENV"
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust helper toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup override set 1.94.0
          rustc --version
          cargo --version
          cargo fetch --locked --manifest-path TriageCopilotHelper/Cargo.toml
          # Use rustup's proxy, wherever this image installs it, so the pinned
          # override applies inside Xcode's cleared build environment.
          echo "TRIAGE_COPILOT_HELPER_CARGO=$(command -v cargo)" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Run verification gate
        run: scripts/verify-ci.sh
      - name: Run declared Apple silicon performance baseline
        if: matrix.runner == 'macos-26' && vars.TRIAGE_PERFORMANCE_APPLE_SILICON_PROFILE != ''
        env:
          TRIAGE_PERFORMANCE_BASELINE_PROFILE: ${{ vars.TRIAGE_PERFORMANCE_APPLE_SILICON_PROFILE }}
          TRIAGE_PERFORMANCE_INCLUDE_UI: ${{ vars.TRIAGE_PERFORMANCE_APPLE_SILICON_UI_PROFILE == vars.TRIAGE_PERFORMANCE_APPLE_SILICON_PROFILE && '1' || '0' }}
          TRIAGE_PERFORMANCE_COPY_REPORT_TO: ${{ runner.temp }}/triage-performance-${{ matrix.runner }}.json
        run: scripts/run-performance-benchmarks.sh
      - name: Run declared Intel performance baseline
        if: matrix.runner == 'macos-26-intel' && vars.TRIAGE_PERFORMANCE_INTEL_PROFILE != ''
        env:
          TRIAGE_PERFORMANCE_BASELINE_PROFILE: ${{ vars.TRIAGE_PERFORMANCE_INTEL_PROFILE }}
          TRIAGE_PERFORMANCE_INCLUDE_UI: ${{ vars.TRIAGE_PERFORMANCE_INTEL_UI_PROFILE == vars.TRIAGE_PERFORMANCE_INTEL_PROFILE && '1' || '0' }}
          TRIAGE_PERFORMANCE_COPY_REPORT_TO: ${{ runner.temp }}/triage-performance-${{ matrix.runner }}.json
        run: scripts/run-performance-benchmarks.sh
